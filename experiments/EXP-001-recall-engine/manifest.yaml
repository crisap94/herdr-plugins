  recall-a: 9575e0f feat/tab-recap-recall-judge, merged to main as b0e31b9 (!42) — state ruler, anchors, G11/G12, short retry, kappa, per-chapter comparison
  recall-b: dadb961 feat/tab-recap-recall-pipeline (rebased on 9575e0f; its final commit and MR are added when it lands) — chunking, triggers, enumerate, ask-back, reconcile, --pipeline, curator reconcile
