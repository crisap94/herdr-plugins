data:
  corpus: replay-mine-40.jsonl (private, never on main) — 40 prompts of one real session, 23 turns after grouping, 2248 lines, 4493783 bytes
  corpus_sha256: b773d3d8c44dfd93b9594c49fb8b77809b02e3a271907b906a4bc77538bd1dee
  dev_subset: replay-mine-10.jsonl, sha256 7e0c24f5cd77c16de35a7a2648635c907a23356940bc079f8bfd1d6ad05700c1 (development only, never counts)
models:
  writer: codex / gpt-6-luna, effort medium (TAB_RECAP_EFFORT=medium)
  enumeration: codex / gpt-6-luna, effort low (the writer's harness at low)
  judge: codex / gpt-6-luna, effort medium (TAB_RECAP_JUDGE_BY=recap, TAB_RECAP_JUDGE_EFFORT=medium)
  cost: the codex harness reports no price; cost is model calls per turn
environment:
  host: one Linux workstation (x86_64, Intel Xeon W-2135, 30 GB), Node v24.21.0, codex-cli 0.161.0
  isolation: each coder in its own git worktree; the replay writes a fresh database per run under a scratch directory; the live daemon and database untouched
limits:
  concurrency: R04 ran the four arms in parallel (noisy, superseded); R05–R08 one arm at a time, each arm's model calls in series
  wall_time: R05 13 min 20 s (one), R06 ~20 min, R07 20 min 17 s, R08 29 min 5 s (claude judge); the judge is more than half of each
