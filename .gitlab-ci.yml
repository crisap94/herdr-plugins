# The images are variables so a project or group can point them at a mirror or registry proxy.
variables:
  NODE_IMAGE: node:24
  # The oldest Node the plugin supports (package.json engines): tested on every MR, not only after merge.
  NODE_FLOOR_IMAGE: node:24.14.0
  GLAB_IMAGE: registry.gitlab.com/gitlab-org/cli:latest

default:
  image: $NODE_IMAGE

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "atalaya"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [check, guard, release]

.tab-recap:
  before_script:
    - cd tab-recap
    - npm ci

lint:
  extends: .tab-recap
  stage: check
  script:
    - bash ci/lint.sh

test:
  extends: .tab-recap
  stage: check
  script:
    - bash ci/test.sh

test:floor:
  extends: .tab-recap
  stage: check
  image: $NODE_FLOOR_IMAGE
  script:
    - node --version
    - bash ci/test.sh

# Only the atalaya branch is held to the allowlist; main never needs it.
atalaya-branch-guard:
  stage: guard
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == "atalaya"
  script:
    - bash tab-recap/ci/branch-guard.sh

# Every MR into main says what it changes for the release notes: one changelog:: label and the
# template's two sections. The MR title becomes the changelog line; the labels decide the version.
merge-request-notes:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
  script:
    - bash tab-recap/ci/check-mr.sh

# Manual, on main only: the MRs merged since the previous tag decide whether a release is due and
# which version it is. If so: bump the versions, write the CHANGELOG section, push the commit to
# main and create the annotated tag. RELEASE_TOKEN is a protected, masked CI variable.
release:prepare:
  stage: release
  needs: [lint, test, "test:floor"]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true
  script:
    - bash tab-recap/ci/prepare-release.sh

# A tag `tab-recap-v<x.y.z>`: check that it is a release we can publish, take the notes from the
# CHANGELOG, then create the GitLab release.
release-notes:
  stage: release
  needs: [lint, test, "test:floor"]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG =~ /^tab-recap-v/
  script:
    - git fetch --quiet origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH" "+refs/tags/*:refs/tags/*"
    - bash tab-recap/ci/check-release.sh "$CI_COMMIT_TAG"
    - bash tab-recap/ci/release-notes.sh tab-recap "${CI_COMMIT_TAG#tab-recap-v}" > notes.md
    - cat notes.md
  artifacts:
    paths: [notes.md]

# `release:` with the glab image: release-cli is deprecated since GitLab 18.0 (removal in 20.0).
release:
  stage: release
  image: $GLAB_IMAGE
  needs:
    - job: release-notes
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^tab-recap-v/
  script:
    - echo "releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./notes.md
