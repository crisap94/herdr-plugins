default:
  image: node:24

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "atalaya"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [check, guard]

.tab-recap:
  before_script:
    - cd tab-recap
    - npm ci

lint:
  extends: .tab-recap
  stage: check
  script:
    - bash ci/lint.sh

test:
  extends: .tab-recap
  stage: check
  script:
    - bash ci/test.sh

# Only the atalaya branch is held to the allowlist; main never needs it.
atalaya-branch-guard:
  stage: guard
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == "atalaya"
  script:
    - bash tab-recap/ci/branch-guard.sh
