include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  AST_ENABLE_MR_PIPELINES: "true"
  BUN_IMAGE: oven/bun:1.4-debian
  BUN_FLOOR_IMAGE: oven/bun:1.4.4-debian
  GLAB_IMAGE: registry.gitlab.com/gitlab-org/cli:latest
  DEPLOY_BRANCHES: '/^atalaya$/'

default:
  image: $BUN_IMAGE

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_job_failure: all
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $DEPLOY_BRANCHES && $CI_COMMIT_BRANCH =~ $DEPLOY_BRANCHES
    - when: never

stages: [check, release]

sast:
  stage: check

secret_detection:
  stage: check

.tools:
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates

.tab-recap:
  before_script:
    - !reference [.tools, before_script]
    - cd tab-recap
    - bun install --frozen-lockfile

.unit:
  variables:
    GIT_DEPTH: "0"
  before_script:
    - !reference [.tools, before_script]
    - git fetch --quiet origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
    - bun install --frozen-lockfile

unit:root:
  extends: .unit
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ci/**/*
        - bun.lock
        - package.json
        - bunfig.toml
        - tsconfig.json
        - .gitlab-ci.yml
        - ci/lib/**/*
  script:
    - bash ci/gates/run.sh lint
    - bash ci/gates/run.sh test

"unit:tab-recap:lint":
  extends: .unit
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tab-recap/**/*
        - packages/**/*
        - bun.lock
        - package.json
        - bunfig.toml
        - tsconfig.json
        - .gitlab-ci.yml
        - ci/lib/**/*
  script:
    - bash tab-recap/gates/run.sh lint

"unit:tab-recap:test":
  extends: .unit
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tab-recap/**/*
        - packages/**/*
        - bun.lock
        - package.json
        - bunfig.toml
        - tsconfig.json
        - .gitlab-ci.yml
        - ci/lib/**/*
  script:
    - apt-get update -qq && apt-get install -y -qq libxml2-utils
    - xmllint --version
    - bash tab-recap/gates/run.sh test

"unit:tab-recap:floor":
  extends: .unit
  stage: check
  image: $BUN_FLOOR_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tab-recap/**/*
        - packages/**/*
        - bun.lock
        - package.json
        - bunfig.toml
        - tsconfig.json
        - .gitlab-ci.yml
        - ci/lib/**/*
  script:
    - bun --version
    - apt-get update -qq && apt-get install -y -qq libxml2-utils
    - xmllint --version
    - bash tab-recap/gates/run.sh test

"unit:session-ledger":
  extends: .unit
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/session-ledger/**/*
        - bun.lock
        - package.json
        - bunfig.toml
        - tsconfig.json
        - .gitlab-ci.yml
        - ci/lib/**/*
  script:
    - bash packages/session-ledger/gates/run.sh lint
    - bash packages/session-ledger/gates/run.sh test

"unit:session-ledger-sqlite":
  extends: .unit
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/session-ledger-sqlite/**/*
        - packages/session-ledger/**/*
        - bun.lock
        - package.json
        - bunfig.toml
        - tsconfig.json
        - .gitlab-ci.yml
        - ci/lib/**/*
  script:
    - bash packages/session-ledger-sqlite/gates/run.sh lint
    - bash packages/session-ledger-sqlite/gates/run.sh test

"unit:recap-view":
  extends: .unit
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/recap-view/**/*
        - packages/session-ledger/**/*
        - bun.lock
        - package.json
        - bunfig.toml
        - tsconfig.json
        - .gitlab-ci.yml
        - ci/lib/**/*
  script:
    - bash packages/recap-view/gates/run.sh lint
    - bash packages/recap-view/gates/run.sh test

"unit:desktop":
  extends: .unit
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - desktop/**/*
        - bun.lock
        - package.json
        - bunfig.toml
        - tsconfig.json
        - .gitlab-ci.yml
        - ci/lib/**/*
      exists:
        - desktop/gates/run.sh
  script:
    - bash desktop/gates/run.sh lint
    - bash desktop/gates/run.sh test

"unit:agent-sdk":
  extends: .unit
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - agent-sdk/**/*
        - packages/session-ledger/**/*
        - bun.lock
        - package.json
        - bunfig.toml
        - tsconfig.json
        - .gitlab-ci.yml
        - ci/lib/**/*
      exists:
        - agent-sdk/gates/run.sh
  script:
    - bash agent-sdk/gates/run.sh lint
    - bash agent-sdk/gates/run.sh test

track-scope:
  stage: check
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - bun ci/check-track.ts

install-smoke:
  extends: .tools
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bun.lock
        - "**/package.json"
        - tab-recap/herdr-plugin.toml
  script:
    - bash ci/install-smoke.sh

lane-scope:
  extends: .tab-recap
  stage: check
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^lane\/B[1-8]-/
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      adapts=0
      case ",$CI_MERGE_REQUEST_LABELS," in *,lane-scope::adapts,*) adapts=1 ;; esac
      LANE_ADAPTS=$adapts LANE_BASE="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" bun ci/check-lane.ts "$(echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | sed -E 's#^lane/(B[1-8])-.*#\1#')"

domain-baseline:
  extends: .tab-recap
  stage: check
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - BASELINE_BASE="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" bash ci/check-domain-baseline.sh

merge-request-notes:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
  script:
    - bash tab-recap/ci/check-mr.sh

release:prepare:
  extends: .tools
  stage: release
  resource_group: release-prepare
  needs: ["unit:tab-recap:lint", "unit:tab-recap:test", "unit:tab-recap:floor", "unit:session-ledger", "unit:session-ledger-sqlite", "unit:recap-view", install-smoke]
  variables:
    GIT_DEPTH: "0"
  allow_failure:
    exit_codes: 1
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - bash tab-recap/ci/prepare-release.sh

release:tag:
  extends: .tools
  stage: release
  allow_failure:
    exit_codes: 1
  needs: ["unit:tab-recap:lint", "unit:tab-recap:test", "unit:tab-recap:floor", "unit:session-ledger", "unit:session-ledger-sqlite", "unit:recap-view", install-smoke]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - git fetch --quiet --tags origin
    - bash tab-recap/ci/tag-release.sh

release-notes:
  extends: .tools
  stage: release
  needs: ["unit:tab-recap:lint", "unit:tab-recap:test", "unit:tab-recap:floor", "unit:session-ledger", "unit:session-ledger-sqlite", "unit:recap-view", install-smoke]
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG =~ /^tab-recap-v/
  script:
    - git fetch --quiet origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH" "+refs/tags/*:refs/tags/*"
    - bash tab-recap/ci/check-release.sh "$CI_COMMIT_TAG"
    - bash tab-recap/ci/release-notes.sh tab-recap "${CI_COMMIT_TAG#tab-recap-v}" > notes.md
    - cat notes.md
  artifacts:
    paths: [notes.md]

release:
  stage: release
  image: $GLAB_IMAGE
  needs:
    - job: release-notes
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^tab-recap-v/
  script:
    - echo "releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./notes.md
