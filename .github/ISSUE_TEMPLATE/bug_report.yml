name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: [tab-recap]
    validations:
      required: true
  - type: input
    id: herdr-version
    attributes:
      label: herdr version
      description: Output of `herdr --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Linux x86_64 / macOS 15 arm64
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness in use
      description: claude, codex, opencode, hermes, or a custom command
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Status output
      description: Output of `node bin/tab-recap.ts status` (run in `tab-recap/`)
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Relevant lines from the daemon log (the path is in the status output)
      render: text
