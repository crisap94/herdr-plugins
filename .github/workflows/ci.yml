name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag or SHA to test (default: the triggering ref)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: tab-recap
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # the newest 24.x: the plugin needs >= 24.21.0 and runner images may cache an older 24
          check-latest: true
          cache: npm
          cache-dependency-path: tab-recap/package-lock.json
      # ci/lint.sh needs bash >= 4 (mapfile); macOS ships 3.2.
      - name: bash >= 4 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      # the writer-context tests validate against the DTD with libxml2's xmllint (macOS ships it)
      - name: xmllint (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - name: Show the toolchain
        run: |
          bash --version | head -n 1
          node --version
          xmllint --version
          bash -c '[ "${BASH_VERSINFO[0]}" -ge 4 ]'
      - run: npm ci
      - run: bash ci/lint.sh
      - run: bash ci/test.sh

  # The oldest Node the plugin supports (node:sqlite without the experimental warning): what `engines` promises is tested.
  floor:
    name: lint + test (Node 24.21.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tab-recap
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: tab-recap/package-lock.json
      # the writer-context tests validate against the DTD with libxml2's xmllint (macOS ships it)
      - name: xmllint (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
      - run: node --version
      - run: xmllint --version
      - run: npm ci
      - run: bash ci/lint.sh
      - run: bash ci/test.sh
