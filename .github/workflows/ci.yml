name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag or SHA to test (default: the triggering ref)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.unit }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        unit: [ci, tab-recap, packages/session-ledger, packages/session-ledger-sqlite, packages/recap-view, desktop, agent-sdk]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: xmllint (Linux)
        if: runner.os == 'Linux'
        run: timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y -qq --no-install-recommends libxml2-utils || (sudo apt-get update -qq && timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libxml2-utils)
      - name: Show the toolchain
        run: |
          /bin/bash --version | head -n 1
          bun --version
          xmllint --version
          bun -e "const [a,b,c]=Bun.version.split('.').map(Number); process.exit(a>1||(a===1&&(b>4||(b===4&&c>=4)))?0:1)"
      - run: bun install --frozen-lockfile
      - name: Gates of ${{ matrix.unit }}
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          if [ -f "$UNIT/gates/run.sh" ]; then /bin/bash "$UNIT/gates/run.sh" lint && /bin/bash "$UNIT/gates/run.sh" test; else echo "$UNIT has no gates/run.sh: nothing to run"; fi

  floor:
    name: lint + test (Bun 1.4.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: xmllint (Linux)
        if: runner.os == 'Linux'
        run: timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 install -y -qq --no-install-recommends libxml2-utils || (sudo apt-get update -qq && timeout 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libxml2-utils)
      - run: bun --version
      - run: xmllint --version
      - run: bun install --frozen-lockfile
      - run: bash tab-recap/gates/run.sh lint
      - run: bash tab-recap/gates/run.sh test
