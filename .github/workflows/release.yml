name: release

on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag, for example tab-recap-v1.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: create the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      # checkout stores a pushed tag as a lightweight ref; fetch the tag object itself, so that
      # check-release.sh sees the annotation.
      - name: Fetch the annotated tag object
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: The tag is a release we can publish
        run: |
          plugin="${TAG%-v*}"
          bash "$plugin/ci/check-release.sh" "$TAG"
      - name: Release notes
        run: |
          plugin="${TAG%-v*}"
          bash "$plugin/ci/release-notes.sh" "$plugin" "${TAG##*-v}" > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plugin="${TAG%-v*}"
          if gh release view "$TAG" > /dev/null 2>&1; then echo "a release for $TAG exists already: nothing to publish"; exit 0; fi
          gh release create "$TAG" --verify-tag --title "$plugin ${TAG##*-v}" --notes-file notes.md
