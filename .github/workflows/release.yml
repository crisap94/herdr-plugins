name: release

# A tag `<plugin>-v<x.y.z>` becomes a GitHub release whose notes are that version's CHANGELOG section.
# Run it by hand (Actions → release → Run workflow) to (re)publish the release of an existing tag.
on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag, for example tab-recap-v1.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

  release:
    name: create the release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      # checkout stores a pushed tag as a lightweight ref; fetch the tag object itself, so that
      # check-release.sh sees the annotation.
      - name: Fetch the annotated tag object
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: The tag is a release we can publish
        run: |
          plugin="${TAG%-v*}"
          bash "$plugin/ci/check-release.sh" "$TAG"
      - name: Release notes
        run: |
          plugin="${TAG%-v*}"
          bash "$plugin/ci/release-notes.sh" "$plugin" "${TAG##*-v}" > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plugin="${TAG%-v*}"
          gh release create "$TAG" --verify-tag --title "$plugin ${TAG##*-v}" --notes-file notes.md
