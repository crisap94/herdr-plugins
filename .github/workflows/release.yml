name: release

# A tag `<plugin>-v<x.y.z>` becomes a GitHub release whose notes are that version's CHANGELOG section.
on:
  push:
    tags: ['*-v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: create the release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: The tag is a release we can publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          plugin="${TAG%-v*}"
          bash "$plugin/ci/check-release.sh" "$TAG"
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          plugin="${TAG%-v*}"
          bash "$plugin/ci/release-notes.sh" "$plugin" "${TAG##*-v}" > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          plugin="${TAG%-v*}"
          gh release create "$TAG" --verify-tag --title "$plugin ${TAG##*-v}" --notes-file notes.md
