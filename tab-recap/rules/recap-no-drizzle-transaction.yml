id: recap-no-drizzle-transaction
language: typescript
severity: error
message: >-
  Drizzle's own `.transaction(...)` is not used: `writeTransaction` (packages/session-ledger-sqlite/src/connection.ts) is the only transaction
  primitive, and it is `BEGIN IMMEDIATE` with a rollback on throw.
note: >-
  Wrap the writes in `writeTransaction(db, () => ...)`. Inside one already, it joins it.
files:
  - "**/src/**"
  - "**/probes/recap-no-drizzle-transaction/**"
rule:
  pattern: $DB.transaction($$$ARGS)
