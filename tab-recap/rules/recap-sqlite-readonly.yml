id: recap-sqlite-readonly
language: typescript
severity: error
message: >-
  A SQLite database is opened `readonly: true`, except the plugin's own, which lives in `src/adapters/db/`.
  opencode's database (and any other store an agent keeps) is the agent's, never ours: a read-only handle
  cannot write, and takes no write lock.
note: >-
  `new Database(path, { readonly: true })`. No options, `readonly: false` or a computed options
  object all fail: pass the literal. Only `src/adapters/db/` (the plugin's own database, in its own state
  directory) may open one writable. Tests may create their own fixture databases.
files:
  - "**/src/**"
  - "**/bin/**"
  - "**/probes/recap-sqlite-readonly/**"
ignores:
  - "**/src/adapters/db/**"
rule:
  any:
    - pattern: new Database($$$)
    - pattern: new $NS.Database($$$)
  not:
    has:
      kind: pair
      regex: '^readonly:\s*true$'
      stopBy: end
