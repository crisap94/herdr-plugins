id: recap-write-transactions
language: typescript
severity: error
message: >-
  A transaction is opened by `writeTransaction` (packages/session-ledger-sqlite/src/connection.ts) and nowhere else: it is `BEGIN IMMEDIATE`,
  so the write lock is taken up front, and a throw rolls back. No bare `BEGIN`.
note: >-
  A deferred `BEGIN` that later upgrades to a write can fail with SQLITE_BUSY at once, whatever the busy timeout
  says. Wrap the writes in `writeTransaction(db, () => …)`; inside one already, it joins it.
files:
  - "**/src/**"
  - "**/bin/**"
  - "**/probes/recap-write-transactions/**"
rule:
  kind: string_fragment
  regex: '^\s*BEGIN\b'
