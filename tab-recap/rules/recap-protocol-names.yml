id: recap-protocol-names
language: typescript
severity: error
message: >-
  A literal copy of an exchange's token name or request prefix outside src/protocol/. The names are
  declared once, in the exchange's descriptor; read them from the descriptor or the registry.
note: >-
  Exact match only: a string that merely contains a name (a note, a log line, a temporary directory
  prefix) is not a copy of the name. The protocol folder declares the names and is excluded.
files:
  - "**/src/**"
  - "**/probes/recap-protocol-names/**"
ignores:
  - "**/src/protocol/**"
rule:
  kind: string_fragment
  regex: "^(compact-req-|tab-recap-compact)$"
