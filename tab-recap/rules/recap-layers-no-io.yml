id: recap-layers-no-io
language: typescript
severity: error
message: >-
  Application and render talk to the world only through ports. They never import
  node built-ins, an adapter, the transport, or a composition root (daemon, column, setup).
note: >-
  src/recap/** is the part that can be tested with no fakes and no timers; an import
  of 'node:fs' or '#src/adapters/' here is the first step to losing that.
files:
  - "**/src/recap/**"
  - "**/src/i18n/**"
  - "**/probes/recap-layers-no-io/**"
rule:
  kind: string_fragment
  inside:
    kind: import_statement
    stopBy: end
  regex: "^(node:|#src/(adapters|transport|daemon|column|setup)/)"
