id: recap-never-types
language: typescript
severity: error
message: >-
  tab-recap never types into a lane. It reads transcripts and renders a column; it
  does not send keys, text or prompts to an agent.
note: >-
  The red line is «no send_keys, ever», and it is stricter than that: no input of any
  kind, because a recap that could type would be an agent, not a recap.
files:
  - "**/src/**"
  - "**/bin/**"
  - "**/probes/recap-never-types/**"
rule:
  kind: string_fragment
  regex: "^(pane\\.send_(keys|text|input)|agent\\.(prompt|send_keys)|pane\\.input\\.set)$"
