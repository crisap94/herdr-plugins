id: recap-never-types
language: typescript
severity: error
message: >-
  tab-recap never types into a lane. It reads transcripts and renders a column; it
  does not send raw input to an agent. (The one prompt the operator asks for is
  `recap-prompt-boundary`.)
note: >-
  The red line is «no send_keys, ever», and it is stricter than that: no raw input of any
  kind except the one compaction the operator asked for, which has its own rule.
files:
  - "**/src/**"
  - "**/bin/**"
  - "**/probes/recap-never-types/**"
rule:
  kind: string_fragment
  regex: "^(pane\\.send_input|agent\\.send_keys|pane\\.input\\.set)$"
